# Codemagic CI/CD configuration for Monitory / Device Manager
#
# Builds debug AND release APKs natively, runs the JVM unit test suite, and
# verifies that the ProfileInstaller crash-fix dependency chain is present in
# every produced artifact.
#
# Signing material is NEVER stored in this repository:
#   - DEBUG_KEYSTORE_BASE64 (secure variable, optional): base64 of debug.keystore
#     (decoded at build time). When absent, a throwaway debug keystore is
#     generated so builds are reproducible and never blocked.
#   - ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
#     ANDROID_KEYSTORE_KEY_ALIAS / ANDROID_KEYSTORE_KEY_PASSWORD (secure
#     variables, optional): release signing. When absent, the release APK is
#     signed with the debug key and is NOT store-distribution ready.

workflows:
  android-native-workflow:
    name: Build Android APK (debug + release)
    max_build_duration: 45
    environment:
      vars:
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError"
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Prepare Gradle wrapper and signing keystores
        script: |
          set -eu
          chmod +x gradlew

          # Debug keystore from secure variable, or generated throwaway key.
          if [ -n "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore -storetype pkcs12 \
              -alias androiddebugkey \
              -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Optional release keystore from secure variables.
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
          else
            echo "NOTE: ANDROID_KEYSTORE_BASE64 not set — release APK will be"
            echo "signed with the debug key (not production ready)."
          fi

      - name: Dependency report and unit tests
        script: |
          set -eux
          ./gradlew --no-daemon :app:dependencies --configuration releaseRuntimeClasspath > dependency-report-release.txt
          ./gradlew --no-daemon test

      - name: Build debug and release APKs
        script: |
          set -eux
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Verify ProfileInstaller crash fix is packaged
        script: |
          set -eux
          # Release crash root cause: ProfileInstaller.writeProfile() ->
          # ProfileVerifier statically initializes ResolvableFuture ->
          # AbstractResolvableFuture (androidx.concurrent:concurrent-futures),
          # which implements com.google.common.util.concurrent.ListenableFuture.
          # If either class is missing from the DEX, devices crash at startup
          # with NoClassDefFoundError. Verify both are defined in every APK.
          found_any=0
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            found_any=1
            echo "== verifying $apk =="
            tmp=$(mktemp -d)
            unzip -q "$apk" 'classes*.dex' -d "$tmp"
            if ! cat "$tmp"/classes*.dex | grep -a -q "Landroidx/concurrent/futures/AbstractResolvableFuture;"; then
              echo "FATAL: AbstractResolvableFuture missing from $apk"
              exit 1
            fi
            if ! cat "$tmp"/classes*.dex | grep -a -q "Lcom/google/common/util/concurrent/ListenableFuture;"; then
              echo "FATAL: ListenableFuture missing from $apk"
              exit 1
            fi
            rm -rf "$tmp"
            echo "OK: futures runtime present in $apk"
          done
          if [ "$found_any" -ne 1 ]; then
            echo "FATAL: no APKs found to verify"
            exit 1
          fi

    artifacts:
      - app/build/outputs/apk/**/*.apk
      - app/build/outputs/mapping/**/mapping.txt
      - dependency-report-release.txt
    publishing:
      email:
        recipients:
          - clintonumelo15@gmail.com
        notify:
          success: true
          failure: true

  android-signed-release:
    name: Build signed Android release APK
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - monitory-release
      vars:
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError"
        REQUIRE_ANDROID_SIGNING: "true"
      java: 17
    scripts:
      - name: Prepare Gradle wrapper
        script: |
          set -eu
          chmod +x gradlew
      - name: Run unit tests and build signed release
        script: |
          set -eu
          ./gradlew --no-daemon test
          ./gradlew --no-daemon assembleRelease
      - name: Verify signed APK
        script: |
          set -eu
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$apk"
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          apksigner=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -type f -name apksigner -print | sort | tail -n 1)
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"
    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/mapping/release/mapping.txt
      - app/build/reports/**
