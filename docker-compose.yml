version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: devicemanager-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Set POSTGRES_PASSWORD in your .env — no password is committed here.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-devicemanager}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: devicemanager-server
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-devicemanager}
      # Set JWT_SECRET in your .env (see .env.example). A previously committed
      # secret must be treated as compromised and rotated.
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    ports:
      - "8080:8080"
    volumes:
      - ./server/uploads:/app/uploads

volumes:
  pgdata:
